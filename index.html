<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>DispatchSim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D1116">
<meta name="description" content="Fictional US truck dispatcher career simulator">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: TMS console — fixed left rail, sticky control bar, dense panels; phone gets a bottom tab bar. Dark-only by design. */
:root{
  --bg:#0D1116;--s1:#141A21;--s2:#1A222B;--s3:#222C37;--line:#2A3543;--line2:#35424F;
  --tx:#E6ECF2;--mu:#93A0AE;--dim:#66737F;--acc:#FF8A1F;--acc2:#FFB066;--acc-ink:#1D1000;
  --blue:#5AA9FF;--good:#3CC27F;--warn:#E9B949;--crit:#F05252;--amber:#F5A524;
  --f-disp:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:8px;--gut:max(16px,env(safe-area-inset-left,0px));--gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx);overflow-x:hidden}
body{margin:0;font:14px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;margin:0 0 10px;text-wrap:balance}
h1{font-size:26px}h2{font-size:21px}h3{font-size:16px}h4{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:16px 0 8px}
a{color:var(--blue)}button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--f-mono);font-size:.95em}
.sub{color:var(--mu);font-size:12.5px}.muted{color:var(--dim)}.pos{color:var(--good)}.neg{color:var(--crit)}.warnt{color:var(--warn)}.r{text-align:right}.center{text-align:center;margin:12px 0}.pre{white-space:pre-wrap}
.row{display:flex;align-items:center}.gap{gap:8px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.eyebrow{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font:14px var(--f-body);max-width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=range]{padding:0;accent-color:var(--acc)}input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
@media (pointer:coarse),(max-width:900px){input,select,textarea{font-size:16px}}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--s2);color:var(--tx);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--mu)}.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}.btn.pri:hover{background:var(--acc2)}
.btn.sec{border-color:var(--acc);color:var(--acc2)}.btn.ghost{background:transparent}.btn.on{border-color:var(--acc);color:var(--acc)}
.btn.danger{border-color:var(--crit);color:var(--crit);background:transparent}.btn.sm{padding:4px 9px;min-height:28px;font-size:13px}.btn.lg{padding:11px 22px;font-size:16px}
.lnk{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}.lnk.strong{color:var(--acc);font-weight:600}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer;padding:4px 8px;min-width:36px;min-height:36px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}.chk.sm{font-size:12.5px;margin:0}
/* Pills & badges */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--s3);color:var(--tx);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.pill.good{background:#173827;color:#7FE0AE}.pill.warn{background:#3A3016;color:#F3D27A}.pill.crit{background:#3E1A1C;color:#FF9B9B}.pill.blue{background:#16304A;color:#9CCBFF}.pill.amber{background:#3D2A0E;color:#FFC870}.pill.muted{background:var(--s2);color:var(--mu)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700}.badge.dot{min-width:8px;height:8px;padding:0}
/* Shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side-nav{position:sticky;top:0;height:100vh;overflow:auto;background:var(--s1);border-right:1px solid var(--line);padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}.brand b{font:700 19px var(--f-disp)}.logo{color:var(--acc);font-size:20px}
.nav-i{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:6px;color:var(--mu);padding:8px 10px;cursor:pointer;text-align:start;font-weight:500}
.nav-i:hover{background:var(--s2);color:var(--tx)}.nav-i.on{background:var(--s3);color:var(--tx);box-shadow:inset 3px 0 var(--acc)}[dir=rtl] .nav-i.on{box-shadow:inset -3px 0 var(--acc)}
.nav-i .ic{width:18px;text-align:center;opacity:.85}.nav-i .lbl{flex:1}.nav-foot{margin-top:auto;padding:10px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px var(--gutr) 8px var(--gut);background:var(--s1);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--s1)}
.clock{display:flex;align-items:baseline;gap:6px}.clock b{font-size:17px;color:var(--acc)}
.ctrl{display:flex;gap:4px;flex-wrap:wrap}.tb-right{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.bell{position:relative;background:var(--s2);border:1px solid var(--line2);border-radius:6px;padding:5px 9px;cursor:pointer;min-height:34px}.bell .badge{position:absolute;top:-7px;inset-inline-end:-7px}
.content{padding:16px var(--gutr) 32px var(--gut);min-width:0}
.hintbar{margin:10px var(--gutr) 0 var(--gut);padding:8px 12px;border:1px dashed var(--acc);border-radius:var(--r);color:var(--acc2);font-size:13px}
.bottom-nav{display:none}.sheet{display:none}
/* Cards & stats */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);min-width:0;margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}.card-h h3{margin:0}.card-b{padding:12px 14px}.card.hl{border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--line2)}
.stat-l{font-size:12px;color:var(--mu)}.stat-v{font:700 22px var(--f-disp);overflow-wrap:anywhere}.stat-v.crit{color:var(--crit)}.stat-v.good{color:var(--good)}.stat-v.warn{color:var(--warn)}.stat-s{font-size:12px;color:var(--dim)}
.meter{margin:6px 0}.meter-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu)}.meter-l b{color:var(--tx)}
.meter-t{height:6px;background:var(--s3);border-radius:4px;overflow:hidden;margin-top:3px}.meter-t i{display:block;height:100%;border-radius:4px}
.meter-t i.good{background:var(--good)}.meter-t i.warn{background:var(--warn)}.meter-t i.crit{background:var(--crit)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}.tabs button{background:none;border:0;padding:8px 12px;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--tx);border-color:var(--acc)}
.empty{padding:28px 16px;text-align:center;color:var(--mu);border:1px dashed var(--line2);border-radius:var(--r);margin:10px 0}
.banner{padding:8px 12px;border-radius:6px;background:var(--s2);border:1px solid var(--line2);margin:8px 0}.banner.crit{border-color:var(--crit);color:#FFB3B3}.banner.warn{border-color:var(--warn);color:#F3D27A}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mu);min-width:0}.field small{color:var(--dim)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;margin:8px 0}.kv dt{color:var(--mu);font-size:12.5px}.kv dd{margin:0}
.kv2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:8px 0;font-size:13.5px}.kv2>span{color:var(--mu)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px}
/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{position:sticky;top:0;background:var(--s2);color:var(--mu);font-weight:600;text-align:start;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.tbl th.r,.tbl td.r{text-align:end}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--s2)}.tbl tr.sel td{background:#2A2114}.tbl tr.tot td{border-top:2px solid var(--line2)}
.tbl .sub{font-size:11.5px}.up{color:var(--good);font-size:11px;margin-inline-start:4px}.down{color:var(--crit);font-size:11px;margin-inline-start:4px}
.list{list-style:none;margin:0;padding:0}.list li{padding:7px 0;border-bottom:1px solid var(--line)}.list li.click{cursor:pointer}.list li.sel{color:var(--acc)}
.list li.pri-critical b{color:#FF9B9B}.list li.pri-urgent b{color:#FFC870}
.log{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto;font-size:13px}.log li{padding:4px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}.log .mono{color:var(--acc);flex:none;font-size:12px}.log .k-bad{color:#FFB3B3}.log .k-good{color:#9FE6C0}
.hist{list-style:none;margin:0;padding:0;font-size:13px;max-height:360px;overflow:auto}.hist li{padding:5px 0;border-bottom:1px solid var(--line)}.hist li.neg{color:#FFB3B3}.hist li.pos{color:#9FE6C0}
.deltas{display:inline-flex;gap:6px;flex-wrap:wrap;margin-inline-start:6px}.deltas span{font-size:11.5px}
.bul{margin:0;padding-inline-start:18px}.bul li{margin:6px 0}
/* Dashboard */
.dash-head{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;margin-bottom:14px}.big-clock{font:700 26px var(--f-disp);color:var(--acc)}
.dash-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.dash-grid .card{margin:0}.dash-grid>.card:first-child{grid-column:span 2}.span2{grid-column:span 2}
.tut{border:1px solid var(--acc);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;background:#1E1710;display:flex;flex-direction:column;gap:8px}.tut-l{margin:0;padding-inline-start:20px;columns:2;font-size:13px;color:var(--mu)}.tut-l li.done{color:var(--good);text-decoration:line-through}
/* Load board */
.lb-table .mono{white-space:nowrap}.lb-table td b{white-space:nowrap}.with-side .hs{display:none}
.lb.with-side{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}.lb-main{min-width:0}
.lb-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}.lb-top h1{margin:0}.avail{padding-bottom:7px}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.booked-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--s2);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12.5px;color:var(--tx);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip.crit{border-color:var(--crit);color:#FFB3B3}
.lb-table{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 290px);overflow:auto}.lb-cards{display:none}
.side{position:sticky;top:64px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 80px);overflow:auto}
.side-h{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--s1);z-index:2}.side-h h2{margin:0}
.side-b{padding:12px 14px}.side-actions{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.side-actions .btn{flex:1;justify-content:center}
.rate-hero{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rate-hero b{font:700 30px var(--f-disp);color:var(--acc)}
.costs{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mu)}.costs b{color:var(--tx)}.costs b.neg{color:var(--crit)}.costs b.pos{color:var(--good)}
.contact{background:var(--s2);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}.sel{user-select:all;font-family:var(--f-mono);font-size:12.5px}
.feas{border-inline-start:3px solid var(--line2);padding:6px 10px;background:var(--s2);border-radius:4px;margin-top:8px}.feas.good{border-color:var(--good)}.feas.warn{border-color:var(--warn)}.feas.crit{border-color:var(--crit)}.feas ul{margin:6px 0;padding-inline-start:18px;font-size:13px}
.neg-h{list-style:none;padding:0;margin:4px 0;font-size:13px}.neg-h li.broker{color:var(--acc2)}
.nmsg{padding:8px 10px;border-radius:6px;background:var(--s2);margin:6px 0}.nmsg.accept{border-inline-start:3px solid var(--good)}.nmsg.counter,.nmsg.final{border-inline-start:3px solid var(--warn)}.nmsg.reject,.nmsg.end{border-inline-start:3px solid var(--crit)}
.lcard{display:flex;flex-direction:column;gap:4px;text-align:start;width:100%;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer;color:var(--tx)}
.lc-top{display:flex;justify-content:space-between;gap:8px}.lc-rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lc-rate b{font:700 24px var(--f-disp);color:var(--acc)}
.only-m{display:none}
/* Term popover */
.term-w{position:relative}.term{background:none;border:0;padding:0;color:inherit;border-bottom:1px dotted var(--acc);cursor:help;font:inherit}
.term-pop{position:absolute;z-index:50;top:120%;inset-inline-start:0;width:min(280px,80vw);background:var(--s3);border:1px solid var(--line2);border-radius:6px;padding:10px;font-size:12.5px;font-weight:400;color:var(--tx);text-transform:none;letter-spacing:0;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 24px #0008;white-space:normal;text-align:start}.term-pop em{color:var(--mu)}
/* Fleet */
.hos{margin:10px 0}.hosb{display:grid;grid-template-columns:110px 1fr 48px;align-items:center;gap:8px;font-size:12.5px;color:var(--mu)}.hosb .meter-t{margin:0}.hosb b{color:var(--tx);text-align:end}
.eld{display:grid;grid-template-columns:30px 1fr;gap:4px;margin:8px 0}.eld-l{display:grid;grid-template-rows:repeat(4,1fr);font-size:10px;color:var(--mu)}.eld svg{width:100%;height:64px;background:var(--s2);border-radius:4px}.eld .sub{grid-column:2}
.eld .grid{stroke:var(--line2);stroke-width:.2}.eld-D{fill:var(--acc)}.eld-ON{fill:var(--blue)}.eld-OFF{fill:var(--mu)}.eld-SB{fill:#7C6CF0}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}.split-l,.split-r{min-width:0}
.drow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid transparent;border-radius:6px;padding:8px;cursor:pointer;text-align:start;color:var(--tx)}.drow:hover{background:var(--s2)}.drow.on{background:var(--s2);border-color:var(--line2)}.drow .sub{display:block}
.av{position:relative;flex:none;width:36px;height:36px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font:700 13px var(--f-disp);color:var(--acc2)}.av.lg{width:56px;height:56px;font-size:20px}
.prof-h{display:flex;gap:14px;align-items:center;margin-bottom:8px}.prof-h h2{margin:0}.profile .row{margin:6px 0}
.hire{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
/* Map */
.mappage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.map-wrap{min-width:0}
.map-tools{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.map{width:100%;height:calc(100vh - 190px);min-height:360px;background:#0A1C2B;border:1px solid var(--line);border-radius:var(--r);touch-action:none;cursor:grab;display:block}
.sea{fill:#0A1C2B}.land{fill:#18212B;stroke:#3B4856;stroke-width:.8}.lake{fill:#0A1C2B;stroke:#24435B;stroke-width:.5}.border{fill:none;stroke:#34414E;stroke-dasharray:2 2}
.hw{fill:none;stroke:#5B4A2E;stroke-linejoin:round}.hw.toll{stroke:#8C6B2E;stroke-dasharray:4 2}.shield{fill:#C9A46A;font-family:var(--f-mono);text-anchor:middle}
.city{fill:#8FA3B8}.clabel{fill:#AEBBC8;font-family:var(--f-body);paint-order:stroke;stroke:#0D1116;stroke-width:2px}
.traffic{fill:#F05252;fill-opacity:.16;stroke:#F05252;stroke-opacity:.4}.wx{fill-opacity:.14;stroke-dasharray:3 3}.wx-snow,.wx-ice{fill:#CFE4FF;stroke:#CFE4FF}.wx-rain,.wx-storm{fill:#5AA9FF;stroke:#5AA9FF}.wx-fog,.wx-wind{fill:#B0B7BF;stroke:#B0B7BF}.wxl{fill:#D9E6F5;text-anchor:middle;font-family:var(--f-body)}
.poi{text-anchor:middle;fill:#F5D08A}
.r-done{fill:none;stroke:#7D8A98;stroke-linecap:round;stroke-linejoin:round}.r-rem{fill:none;stroke:var(--acc);stroke-dasharray:6 4;stroke-linecap:round}.r-future{fill:none;stroke:#FFB066;stroke-opacity:.5;stroke-dasharray:2 4}.r-plan{fill:none;stroke:var(--blue);stroke-linecap:round}
.mk{stroke:#0D1116;stroke-width:1}.mk-P{fill:var(--blue)}.mk-D{fill:var(--good)}.mkt{fill:#0D1116;text-anchor:middle;font-weight:700;font-family:var(--f-body)}
.truck circle{fill:var(--acc);stroke:#fff;stroke-width:1.2}.truck.on circle{fill:#FFD08A;stroke:var(--acc);stroke-width:2}.truck text{fill:#1D1000;text-anchor:middle;font-weight:700;font-family:var(--f-mono);pointer-events:none}.truck.ts-idle circle{fill:#9FB0C2}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}.lg{display:inline-block;width:20px;height:0;border-top:3px solid;vertical-align:middle;margin-inline-end:4px}.lg.r-rem{border-color:var(--acc);border-top-style:dashed}.lg.r-future{border-color:#FFB066;border-top-style:dotted}.lg.r-done{border-color:#7D8A98}.lg.toll{border-color:#8C6B2E;border-top-style:dashed}
.map-side{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0;max-height:calc(100vh - 150px);overflow:auto}
.planner{display:flex;flex-direction:column;gap:8px}.plan-res ol{padding-inline-start:18px}
/* Messages */

 \u043C\u0438\u043B\u044E",es:"Tarifa por milla",ru:"\u0421\u0442\u0430\u0432\u043A\u0430 \u0437\u0430 \u043C\u0438\u043B\u044E"},body:{en:"Rate per loaded mile = rate \xF7 loaded miles. Rate per total mile = rate \xF7 (loaded + deadhead). Example: $2,000 for 800 loaded miles is $2.50/mi loaded, but with 200 deadhead miles it is $2.00/mi all-in. Brokers advertise loaded RPM; your costs run on every mile.",uk:"\u0421\u0442\u0430\u0432\u043A\u0430 \u0437\u0430 \u0433\u0440\u0443\u0436\u0435\u043D\u0443 \u043C\u0438\u043B\u044E = \u0441\u0442\u0430\u0432\u043A\u0430 \xF7 \u0433\u0440\u0443\u0436\u0435\u043D\u0456 \u043C\u0438\u043B\u0456. \u0421\u0442\u0430\u0432\u043A\u0430 \u0437\u0430 \u0437\u0430\u0433\u0430\u043B\u044C\u043D\u0443 \u043C\u0438\u043B\u044E = \u0441\u0442\u0430\u0432\u043A\u0430 \xF7 (\u0433\u0440\u0443\u0436\u0435\u043D\u0456 + \u043F\u043E\u0440\u043E\u0436\u043D\u0456). \u041F\u0440\u0438\u043A\u043B\u0430\u0434: $2000 \u0437\u0430 800 \u043C\u0438\u043B\u044C \u2014 \u0446\u0435 $2,50/\u043C\u0438\u043B\u044F, \u0430\u043B\u0435 \u0437 200 \u043F\u043E\u0440\u043E\u0436\u043D\u0456\u043C\u0438 \u043C\u0438\u043B\u044F\u043C\u0438 \u2014 $2,00/\u043C\u0438\u043B\u044F. \u0411\u0440\u043E\u043A\u0435\u0440\u0438 \u0440\u0435\u043A\u043B\u0430\u043C\u0443\u044E\u0442\u044C \u0441\u0442\u0430\u0432\u043A\u0443 \u0437\u0430 \u0433\u0440\u0443\u0436\u0435\u043D\u0443 \u043C\u0438\u043B\u044E, \u0430 \u0432\u0438\u0442\u0440\u0430\u0442\u0438 \u0439\u0434\u0443\u0442\u044C \u043D\u0430 \u043A\u043E\u0436\u043D\u0443 \u043C\u0438\u043B\u044E.",es:"Tarifa por milla cargada = tarifa \xF7 millas cargadas. Por milla total = tarifa \xF7 (cargadas + vac\xEDo). Ejemplo: $2.000 por 800 millas son $2,50/milla cargada, pero con 200 millas en vac\xEDo son $2,00/milla total. Tus costos corren en cada milla.",ru:"\u0421\u0442\u0430\u0432\u043A\u0430 \u0437\u0430 \u0433\u0440\u0443\u0436\u0451\u043D\u0443\u044E \u043C\u0438\u043B\u044E = \u0441\u0442\u0430\u0432\u043A\u0430 \xF7 \u0433\u0440\u0443\u0436\u0451\u043D\u044B\u0435 \u043C\u0438\u043B\u0438. \u0417\u0430 \u043E\u0431\u0449\u0443\u044E \u043C\u0438\u043B\u044E = \u0441\u0442\u0430\u0432\u043A\u0430 \xF7 (\u0433\u0440\u0443\u0436\u0451\u043D\u044B\u0435 + \u0445\u043E\u043B\u043E\u0441\u0442\u044B\u0435). \u041F\u0440\u0438\u043C\u0435\u0440: $2000 \u0437\u0430 800 \u043C\u0438\u043B\u044C \u2014 $2,50/\u043C\u0438\u043B\u044F, \u043D\u043E \u0441 200 \u0445\u043E\u043B\u043E\u0441\u0442\u044B\u043C\u0438 \u2014 $2,00/\u043C\u0438\u043B\u044F. \u0411\u0440\u043E\u043A\u0435\u0440\u044B \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442 \u0441\u0442\u0430\u0432\u043A\u0443 \u0437\u0430 \u0433\u0440\u0443\u0436\u0451\u043D\u0443\u044E \u043C\u0438\u043B\u044E, \u0430 \u0440\u0430\u0441\u0445\u043E\u0434\u044B \u0438\u0434\u0443\u0442 \u043D\u0430 \u043A\u0430\u0436\u0434\u0443\u044E \u043C\u0438\u043B\u044E."},practice:{q:"A load pays $1,650 for 600 loaded miles. Deadhead is 150 miles. What is the rate per TOTAL mile? (dollars, 2 decimals)",a:2.2,tol:.01},quiz:[{q:"$1,800 for 720 loaded miles plus 180 deadhead. All-in RPM?",o:["$2.50","$2.00","$2.25"],a:1,why:"1800 \xF7 (720 + 180) = $2.00."}]},{id:"deadhead",title:{en:"Calculating deadhead",uk:"\u0420\u043E\u0437\u0440\u0430\u0445\u0443\u043D\u043E\u043A \u043F\u043E\u0440\u043E\u0436\u043D\u044C\u043E\u0433\u043E \u043F\u0440\u043E\u0431\u0456\u0433\u0443",es:"Calcular millas en vac\xEDo",ru:"\u0420\u0430\u0441\u0447\u0451\u0442 \u0445\u043E\u043B\u043E\u0441\u0442\u043E\u0433\u043E \u043F\u0440\u043E\u0431\u0435\u0433\u0430"},body:{en:"Deadhead is the empty distance from where the truck will be to the pickup. Measure it from the projected location after the current delivery, not from where the truck is now. Keep total deadhead under about 10\u201315% of miles. A slightly lower rate near the truck often beats a higher rate 300 miles away.",uk:"\u041F\u043E\u0440\u043E\u0436\u043D\u0456\u0439 \u043F\u0440\u043E\u0431\u0456\u0433 \u2014 \u0446\u0435 \u0432\u0456\u0434\u0441\u0442\u0430\u043D\u044C \u0432\u0456\u0434 \u043C\u0456\u0441\u0446\u044F, \u0434\u0435 \u0431\u0443\u0434\u0435 \u0442\u0440\u0430\u043A, \u0434\u043E \u0437\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u043D\u044F. \u0420\u0430\u0445\u0443\u0439\u0442\u0435 \u0432\u0456\u0434 \u043C\u0456\u0441\u0446\u044F \u043F\u0456\u0441\u043B\u044F \u043F\u043E\u0442\u043E\u0447\u043D\u043E\u0457 \u0434\u043E\u0441\u0442\u0430\u0432\u043A\u0438, \u0430 \u043D\u0435 \u0432\u0456\u0434 \u043F\u043E\u0442\u043E\u0447\u043D\u043E\u0433\u043E. \u0422\u0440\u0438\u043C\u0430\u0439\u0442\u0435 \u043F\u043E\u0440\u043E\u0436\u043D\u0456\u0439 \u043F\u0440\u043E\u0431\u0456\u0433 \u0434\u043E 10\u201315% \u043C\u0438\u043B\u044C. \u0422\u0440\u043E\u0445\u0438 \u043D\u0438\u0436\u0447\u0430 \u0441\u0442\u0430\u0432\u043A\u0430 \u043F\u043E\u0440\u0443\u0447 \u0447\u0430\u0441\u0442\u043E \u043A\u0440\u0430\u0449\u0430 \u0437\u0430 \u0432\u0438\u0449\u0443 \u0437\u0430 300 \u043C\u0438\u043B\u044C.",es:"El vac\xEDo es la distancia desde donde estar\xE1 el cami\xF3n hasta la recogida. M\xEDdelo desde la ubicaci\xF3n tras la entrega actual, no desde la actual. Mant\xE9n el vac\xEDo por debajo del 10\u201315%. Una tarifa algo menor cerca suele ganar a una mayor a 300 millas.",ru:"\u0425\u043E\u043B\u043E\u0441\u0442\u043E\u0439 \u043F\u0440\u043E\u0431\u0435\u0433 \u2014 \u0440\u0430\u0441\u0441\u0442\u043E\u044F\u043D\u0438\u0435 \u043E\u0442 \u043C\u0435\u0441\u0442\u0430, \u0433\u0434\u0435 \u0431\u0443\u0434\u0435\u0442 \u0442\u0440\u0430\u043A, \u0434\u043E \u043F\u043E\u0433\u0440\u0443\u0437\u043A\u0438. \u0421\u0447\u0438\u0442\u0430\u0439\u0442\u0435 \u043E\u0442 \u0442\u043E\u0447\u043A\u0438 \u043F\u043E\u0441\u043B\u0435 \u0442\u0435\u043A\u0443\u0449\u0435\u0439 \u0434\u043E\u0441\u0442\u0430\u0432\u043A\u0438, \u0430 \u043D\u0435 \u043E\u0442 \u0442\u0435\u043A\u0443\u0449\u0435\u0439. \u0414\u0435\u0440\u0436\u0438\u0442\u0435 \u0445\u043E\u043B\u043E\u0441\u0442\u043E\u0439 \u043F\u0440\u043E\u0431\u0435\u0433 \u0434\u043E 10\u201315% \u043C\u0438\u043B\u044C. \u0427\u0443\u0442\u044C \u0431\u043E\u043B\u0435\u0435 \u043D\u0438\u0437\u043A\u0430\u044F \u0441\u0442\u0430\u0432\u043A\u0430 \u0440\u044F\u0434\u043E\u043C \u0447\u0430\u0441\u0442\u043E \u043B\u0443\u0447\u0448\u0435 \u0432\u044B\u0441\u043E\u043A\u043E\u0439 \u0432 300 \u043C\u0438\u043B\u044F\u0445."},quiz:[{q:"Truck delivers in Dallas tomorrow 10 AM. Measure deadhead for the next load from\u2026",o:["The truck's current location","Dallas (projected empty location)","The company yard"],a:1,why:"Plan from where and when the truck will actually be empty."}]},{id:"negotiate",title:{en:"How to negotiate",uk:"\u042F\u043A \u0442\u043E\u0440\u0433\u0443\u0432\u0430\u0442\u0438\u0441\u044F",es:"C\xF3mo negociar",ru:"\u041A\u0430\u043A \u0442\u043E\u0440\u0433\u043E\u0432\u0430\u0442\u044C\u0441\u044F"},body:{en:"Know your minimum before calling (costs plus target profit). Ask questions first: weight, hours, detention terms. Counter 5\u201310% above posted and give a reason (deadhead, tight appointment, market). Brokers have different styles: some move, some are firm. Never accept a load that loses money just to stay busy, and never promise what HOS does not allow.",uk:"\u0417\u043D\u0430\u0439\u0442\u0435 \u0441\u0432\u0456\u0439 \u043C\u0456\u043D\u0456\u043C\u0443\u043C \u0434\u043E \u0434\u0437\u0432\u0456\u043D\u043A\u0430 (\u0432\u0438\u0442\u0440\u0430\u0442\u0438 + \u0431\u0430\u0436\u0430\u043D\u0438\u0439 \u043F\u0440\u0438\u0431\u0443\u0442\u043E\u043A). \u0421\u043F\u0435\u0440\u0448\u0443 \u043F\u0438\u0442\u0430\u0439\u0442\u0435: \u0432\u0430\u0433\u0430, \u0433\u043E\u0434\u0438\u043D\u0438, detention. \u041F\u0440\u043E\u043F\u043E\u043D\u0443\u0439\u0442\u0435 \u043D\u0430 5\u201310% \u0431\u0456\u043B\u044C\u0448\u0435 \u0437 \u043F\u043E\u044F\u0441\u043D\u0435\u043D\u043D\u044F\u043C (\u043F\u043E\u0440\u043E\u0436\u043D\u0456\u0439 \u043F\u0440\u043E\u0431\u0456\u0433, \u0442\u0456\u0441\u043D\u0435 \u0432\u0456\u043A\u043D\u043E, \u0440\u0438\u043D\u043E\u043A). \u0411\u0440\u043E\u043A\u0435\u0440\u0438 \u0440\u0456\u0437\u043D\u0456: \u0445\u0442\u043E\u0441\u044C \u043F\u043E\u0441\u0442\u0443\u043F\u0430\u0454\u0442\u044C\u0441\u044F, \u0445\u0442\u043E\u0441\u044C \u043D\u0456. \u041D\u0435 \u0431\u0435\u0440\u0456\u0442\u044C \u0437\u0431\u0438\u0442\u043A\u043E\u0432\u0438\u0445 \u0432\u0430\u043D\u0442\u0430\u0436\u0456\u0432 \u0456 \u043D\u0435 \u043E\u0431\u0456\u0446\u044F\u0439\u0442\u0435 \u0442\u043E\u0433\u043E, \u0449\u043E \u043D\u0435 \u0434\u043E\u0437\u0432\u043E\u043B\u044F\u0454 HOS.",es:"Conoce tu m\xEDnimo antes de llamar (costos + ganancia). Pregunta primero: peso, horarios, detenci\xF3n. Contraoferta 5\u201310% sobre lo publicado con un motivo. Cada br\xF3ker tiene su estilo. Nunca aceptes cargas con p\xE9rdida solo por estar ocupado ni prometas lo que el HOS no permite.",ru:"\u0417\u043D\u0430\u0439\u0442\u0435 \u0441\u0432\u043E\u0439 \u043C\u0438\u043D\u0438\u043C\u0443\u043C \u0434\u043E \u0437\u0432\u043E\u043D\u043A\u0430 (\u0440\u0430\u0441\u0445\u043E\u0434\u044B + \u043F\u0440\u0438\u0431\u044B\u043B\u044C). \u0421\u043D\u0430\u0447\u0430\u043B\u0430 \u0437\u0430\u0434\u0430\u0439\u0442\u0435 \u0432\u043E\u043F\u0440\u043E\u0441\u044B: \u0432\u0435\u0441, \u0447\u0430\u0441\u044B, detention. \u041F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u0439\u0442\u0435 \u043D\u0430 5\u201310% \u0432\u044B\u0448\u0435 \u0441 \u043F\u0440\u0438\u0447\u0438\u043D\u043E\u0439 (\u0445\u043E\u043B\u043E\u0441\u0442\u043E\u0439 \u043F\u0440\u043E\u0431\u0435\u0433, \u0443\u0437\u043A\u043E\u0435 \u043E\u043A\u043D\u043E, \u0440\u044B\u043D\u043E\u043A). \u0411\u0440\u043E\u043A\u0435\u0440\u044B \u0440\u0430\u0437\u043D\u044B\u0435: \u043A\u0442\u043E-\u0442\u043E \u0443\u0441\u0442\u0443\u043F\u0430\u0435\u0442, \u043A\u0442\u043E-\u0442\u043E \u043D\u0435\u0442. \u041D\u0435 \u0431\u0435\u0440\u0438\u0442\u0435 \u0443\u0431\u044B\u0442\u043E\u0447\u043D\u044B\u0435 \u0433\u0440\u0443\u0437\u044B \u0438 \u043D\u0435 \u043E\u0431\u0435\u0449\u0430\u0439\u0442\u0435 \u0442\u043E\u0433\u043E, \u0447\u0442\u043E \u043D\u0435 \u043F\u043E\u0437\u0432\u043E\u043B\u044F\u0435\u0442 HOS."},quiz:[{q:"Posted $2,000. A good first counter is:",o:["$2,150 with a reason","$3,000","Accept immediately"],a:0,why:"A modest counter (5\u201310%) with a reason keeps the broker talking."}]},{id:"brokers",title:{en:"Speaking with brokers",uk:"\u0420\u043E\u0437\u043C\u043E\u0432\u0430 \u0437 \u0431\u0440\u043E\u043A\u0435\u0440\u0430\u043C\u0438",es:"Hablar con br\xF3kers",ru:"\u0420\u0430\u0437\u0433\u043E\u0432\u043E\u0440 \u0441 \u0431\u0440\u043E\u043A\u0435\u0440\u0430\u043C\u0438"},body:{en:"Be short and professional: company, MC number, equipment, location, availability. Ask about the load before price. Confirm everything in writing on the rate confirmation. Report delays early with a new ETA. Brokers forgive delays they hear about early; they don't forgive surprises.",uk:"\u0411\u0443\u0434\u044C\u0442\u0435 \u043A\u043E\u0440\u043E\u0442\u043A\u0438\u043C\u0438 \u0456 \u043F\u0440\u043E\u0444\u0435\u0441\u0456\u0439\u043D\u0438\u043C\u0438: \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u044F, MC, \u043E\u0431\u043B\u0430\u0434\u043D\u0430\u043D\u043D\u044F, \u043B\u043E\u043A\u0430\u0446\u0456\u044F, \u043A\u043E\u043B\u0438 \u0432\u0456\u043B\u044C\u043D\u0456. \u0421\u043F\u0435\u0440\u0448\u0443 \u043F\u0438\u0442\u0430\u0439\u0442\u0435 \u043F\u0440\u043E \u0432\u0430\u043D\u0442\u0430\u0436, \u043F\u043E\u0442\u0456\u043C \u043F\u0440\u043E \u0446\u0456\u043D\u0443. \u0423\u0441\u0435 \u043F\u0456\u0434\u0442\u0432\u0435\u0440\u0434\u0436\u0443\u0439\u0442\u0435 \u043F\u0438\u0441\u044C\u043C\u043E\u0432\u043E \u0432 rate con. \u041F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u044F\u0439\u0442\u0435 \u043F\u0440\u043E \u0437\u0430\u0442\u0440\u0438\u043C\u043A\u0438 \u0440\u0430\u043D\u043E \u0437 \u043D\u043E\u0432\u0438\u043C ETA. \u0411\u0440\u043E\u043A\u0435\u0440\u0438 \u043F\u0440\u043E\u0431\u0430\u0447\u0430\u044E\u0442\u044C \u0437\u0430\u0442\u0440\u0438\u043C\u043A\u0438, \u0430\u043B\u0435 \u043D\u0435 \u0441\u044E\u0440\u043F\u0440\u0438\u0437\u0438.",es:"S\xE9 breve y profesional: empresa, MC, equipo, ubicaci\xF3n, disponibilidad. Pregunta por la carga antes del precio. Confirma todo por escrito. Avisa de retrasos temprano con nueva hora estimada. Los br\xF3kers perdonan retrasos avisados, no sorpresas.",ru:"\u0411\u0443\u0434\u044C\u0442\u0435 \u043A\u0440\u0430\u0442\u043A\u0438\u043C\u0438 \u0438 \u043F\u0440\u043E\u0444\u0435\u0441\u0441\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u043C\u0438: \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u044F, MC, \u043E\u0431\u043E\u0440\u0443\u0434\u043E\u0432\u0430\u043D\u0438\u0435, \u043B\u043E\u043A\u0430\u0446\u0438\u044F, \u043A\u043E\u0433\u0434\u0430 \u0441\u0432\u043E\u0431\u043E\u0434\u043D\u044B. \u0421\u043D\u0430\u0447\u0430\u043B\u0430 \u0441\u043F\u0440\u0430\u0448\u0438\u0432\u0430\u0439\u0442\u0435 \u043E \u0433\u0440\u0443\u0437\u0435, \u043F\u043E\u0442\u043E\u043C \u043E \u0446\u0435\u043D\u0435. \u0412\u0441\u0451 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0430\u0439\u0442\u0435 \u043F\u0438\u0441\u044C\u043C\u0435\u043D\u043D\u043E. \u0421\u043E\u043E\u0431\u0449\u0430\u0439\u0442\u0435 \u043E \u0437\u0430\u0434\u0435\u0440\u0436\u043A\u0430\u0445 \u0440\u0430\u043D\u043E \u0441 \u043D\u043E\u0432\u044B\u043C ETA. \u0411\u0440\u043E\u043A\u0435\u0440\u044B \u043F\u0440\u043E\u0449\u0430\u044E\u0442 \u0437\u0430\u0434\u0435\u0440\u0436\u043A\u0438, \u043D\u043E \u043D\u0435 \u0441\u044E\u0440\u043F\u0440\u0438\u0437\u044B."},quiz:[{q:"Your truck will be 2 hours late. When do you tell the broker?",o:["After delivery","As soon as you know, with a new ETA","Only if they ask"],a:1,why:"Early notice lets the broker move the appointment and protects your reputation."}]},{id:"drivers",title:{en:"Communicating with drivers",uk:"\u0421\u043F\u0456\u043B\u043A\u0443\u0432\u0430\u043D\u043D\u044F \u0437 \u0432\u043E\u0434\u0456\u044F\u043C\u0438",es:"Comunicarse con choferes",ru:"\u041E\u0431\u0449\u0435\u043D\u0438\u0435 \u0441 \u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044F\u043C\u0438"},body:{en:"Drivers quit dispatchers, not companies. Give clear instructions with addresses, numbers and times. Answer messages quickly. Respect rest and home time; keep promises. Avoid changing plans repeatedly. Never insult a driver, and never pressure anyone to drive tired or past legal hours.",uk:"\u0412\u043E\u0434\u0456\u0457 \u0439\u0434\u0443\u0442\u044C \u0432\u0456\u0434 \u0434\u0438\u0441\u043F\u0435\u0442\u0447\u0435\u0440\u0456\u0432, \u0430 \u043D\u0435 \u0432\u0456\u0434 \u043A\u043E\u043C\u043F\u0430\u043D\u0456\u0439. \u0414\u0430\u0432\u0430\u0439\u0442\u0435 \u0447\u0456\u0442\u043A\u0456 \u0456\u043D\u0441\u0442\u0440\u0443\u043A\u0446\u0456\u0457 \u0437 \u0430\u0434\u0440\u0435\u0441\u0430\u043C\u0438, \u043D\u043E\u043C\u0435\u0440\u0430\u043C\u0438 \u0456 \u0447\u0430\u0441\u043E\u043C. \u0428\u0432\u0438\u0434\u043A\u043E \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u0430\u0439\u0442\u0435. \u041F\u043E\u0432\u0430\u0436\u0430\u0439\u0442\u0435 \u0432\u0456\u0434\u043F\u043E\u0447\u0438\u043D\u043E\u043A \u0456 \u0447\u0430\u0441 \u0443\u0434\u043E\u043C\u0430, \u0442\u0440\u0438\u043C\u0430\u0439\u0442\u0435 \u043E\u0431\u0456\u0446\u044F\u043D\u043A\u0438. \u041D\u0435 \u0437\u043C\u0456\u043D\u044E\u0439\u0442\u0435 \u043F\u043B\u0430\u043D\u0438 \u043F\u043E\u0441\u0442\u0456\u0439\u043D\u043E. \u041D\u0456\u043A\u043E\u043B\u0438 \u043D\u0435 \u043E\u0431\u0440\u0430\u0436\u0430\u0439\u0442\u0435 \u0432\u043E\u0434\u0456\u044F \u0456 \u043D\u0435 \u0442\u0438\u0441\u043D\u0456\u0442\u044C \u0457\u0445\u0430\u0442\u0438 \u0432\u0442\u043E\u043C\u043B\u0435\u043D\u0438\u043C.",es:"Los choferes dejan a los despachadores, no a las empresas. Da instrucciones claras con direcciones, n\xFAmeros y horas. Responde r\xE1pido. Respeta descansos y tiempo en casa; cumple promesas. Evita cambiar planes. Nunca insultes ni presiones a nadie a conducir cansado.",ru:"\u0412\u043E\u0434\u0438\u0442\u0435\u043B\u0438 \u0443\u0445\u043E\u0434\u044F\u0442 \u043E\u0442 \u0434\u0438\u0441\u043F\u0435\u0442\u0447\u0435\u0440\u043E\u0432, \u0430 \u043D\u0435 \u043E\u0442 \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u0439. \u0414\u0430\u0432\u0430\u0439\u0442\u0435 \u0447\u0451\u0442\u043A\u0438\u0435 \u0438\u043D\u0441\u0442\u0440\u0443\u043A\u0446\u0438\u0438 \u0441 \u0430\u0434\u0440\u0435\u0441\u0430\u043C\u0438, \u043D\u043E\u043C\u0435\u0440\u0430\u043C\u0438 \u0438 \u0432\u0440\u0435\u043C\u0435\u043D\u0435\u043C. \u041E\u0442\u0432\u0435\u0447\u0430\u0439\u0442\u0435 \u0431\u044B\u0441\u0442\u0440\u043E. \u0423\u0432\u0430\u0436\u0430\u0439\u0442\u0435 \u043E\u0442\u0434\u044B\u0445 \u0438 \u0432\u0440\u0435\u043C\u044F \u0434\u043E\u043C\u0430, \u0434\u0435\u0440\u0436\u0438\u0442\u0435 \u043E\u0431\u0435\u0449\u0430\u043D\u0438\u044F. \u041D\u0435 \u043C\u0435\u043D\u044F\u0439\u0442\u0435 \u043F\u043B\u0430\u043D\u044B \u043F\u043E\u0441\u0442\u043E\u044F\u043D\u043D\u043E. \u041D\u0438\u043A\u043E\u0433\u0434\u0430 \u043D\u0435 \u043E\u0441\u043A\u043E\u0440\u0431\u043B\u044F\u0439\u0442\u0435 \u0438 \u043D\u0435 \u0434\u0430\u0432\u0438\u0442\u0435 \u0435\u0445\u0430\u0442\u044C \u0443\u0441\u0442\u0430\u0432\u0448\u0438\u043C."},quiz:[{q:"A driver says he is exhausted but the appointment is tight. You\u2026",o:["Ask him to push 2 more hours","Tell him to rest and call the broker about the appointment","Ignore the message"],a:1,why:"Safety first; then manage the appointment with the broker."}]},{id:"hos",title:{en:"Understanding HOS",uk:"\u0429\u043E \u0442\u0430\u043A\u0435 HOS",es:"Entender las HOS",ru:"\u0427\u0442\u043E \u0442\u0430\u043A\u043E\u0435 HOS"},body:{en:"After 10 consecutive hours off duty, a driver may drive up to 11 hours within a 14-hour window. A 30-minute break is required after 8 cumulative hours of driving. Weekly: 70 hours on duty in 8 days; a 34-hour restart resets it. Loading and waiting on duty count toward the 14 hours. Plan trips around these limits.",uk:"\u041F\u0456\u0441\u043B\u044F 10 \u0433\u043E\u0434\u0438\u043D \u0432\u0456\u0434\u043F\u043E\u0447\u0438\u043D\u043A\u0443 \u0432\u043E\u0434\u0456\u0439 \u043C\u043E\u0436\u0435 \u0457\u0445\u0430\u0442\u0438 \u0434\u043E 11 \u0433\u043E\u0434\u0438\u043D \u0443 \u043C\u0435\u0436\u0430\u0445 14-\u0433\u043E\u0434\u0438\u043D\u043D\u043E\u0433\u043E \u0432\u0456\u043A\u043D\u0430. \u041F\u0456\u0441\u043B\u044F 8 \u0433\u043E\u0434\u0438\u043D \u0432\u043E\u0434\u0456\u043D\u043D\u044F \u2014 \u043F\u0435\u0440\u0435\u0440\u0432\u0430 30 \u0445\u0432. \u0422\u0438\u0436\u0434\u0435\u043D\u044C: 70 \u0433\u043E\u0434\u0438\u043D \u0440\u043E\u0431\u043E\u0442\u0438 \u0437\u0430 8 \u0434\u043D\u0456\u0432; 34 \u0433\u043E\u0434\u0438\u043D\u0438 \u0432\u0456\u0434\u043F\u043E\u0447\u0438\u043D\u043A\u0443 \u0441\u043A\u0438\u0434\u0430\u044E\u0442\u044C \u043B\u0456\u043C\u0456\u0442. \u0417\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u043D\u044F \u0442\u0430 \u043E\u0447\u0456\u043A\u0443\u0432\u0430\u043D\u043D\u044F \u043D\u0430 \u0437\u043C\u0456\u043D\u0456 \u0432\u0445\u043E\u0434\u044F\u0442\u044C \u0443 14 \u0433\u043E\u0434\u0438\u043D.",es:"Tras 10 horas libres seguidas, el chofer puede conducir hasta 11 h dentro de una ventana de 14 h. Se requiere una pausa de 30 min tras 8 h de conducci\xF3n. Semanal: 70 h en 8 d\xEDas; un reinicio de 34 h lo pone a cero. Cargar y esperar en servicio cuenta para las 14 h.",ru:"\u041F\u043E\u0441\u043B\u0435 10 \u0447\u0430\u0441\u043E\u0432 \u043E\u0442\u0434\u044B\u0445\u0430 \u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C \u043C\u043E\u0436\u0435\u0442 \u0435\u0445\u0430\u0442\u044C \u0434\u043E 11 \u0447\u0430\u0441\u043E\u0432 \u0432 \u043F\u0440\u0435\u0434\u0435\u043B\u0430\u0445 14-\u0447\u0430\u0441\u043E\u0432\u043E\u0433\u043E \u043E\u043A\u043D\u0430. \u041F\u043E\u0441\u043B\u0435 8 \u0447\u0430\u0441\u043E\u0432 \u0432\u043E\u0436\u0434\u0435\u043D\u0438\u044F \u2014 \u043F\u0435\u0440\u0435\u0440\u044B\u0432 30 \u043C\u0438\u043D. \u041D\u0435\u0434\u0435\u043B\u044F: 70 \u0447\u0430\u0441\u043E\u0432 \u0440\u0430\u0431\u043E\u0442\u044B \u0437\u0430 8 \u0434\u043D\u0435\u0439; 34 \u0447\u0430\u0441\u0430 \u043E\u0442\u0434\u044B\u0445\u0430 \u043E\u0431\u043D\u0443\u043B\u044F\u044E\u0442 \u043B\u0438\u043C\u0438\u0442. \u041F\u043E\u0433\u0440\u0443\u0437\u043A\u0430 \u0438 \u043E\u0436\u0438\u0434\u0430\u043D\u0438\u0435 \u043D\u0430 \u0441\u043C\u0435\u043D\u0435 \u0432\u0445\u043E\u0434\u044F\u0442 \u0432 14 \u0447\u0430\u0441\u043E\u0432."},practice:{q:"A driver started his shift at 6:00 AM after 10 hours off. What is the latest clock time he can drive until (14-hour window)? Answer as a 24h hour number.",a:20,tol:0},quiz:[{q:"Driver drove 8 hours straight. What must happen before more driving?",o:["Nothing","A 30-minute break","A 34-hour restart"],a:1,why:"After 8 cumulative driving hours a 30-minute non-driving period is required."},{q:"Does waiting at the dock on duty count toward the 14-hour window?",o:["Yes","No"],a:0,why:"The 14-hour window keeps running regardless of driving."}]},{id:"profit",title:{en:"Calculating profitability",uk:"\u0420\u043E\u0437\u0440\u0430\u0445\u0443\u043D\u043E\u043A \u043F\u0440\u0438\u0431\u0443\u0442\u043A\u043E\u0432\u043E\u0441\u0442\u0456",es:"Calcular la rentabilidad",ru:"\u0420\u0430\u0441\u0447\u0451\u0442 \u043F\u0440\u0438\u0431\u044B\u043B\u044C\u043D\u043E\u0441\u0442\u0438"},body:{en:"Profit = rate \u2212 (fuel + driver pay + maintenance + tolls + fixed daily costs). Fuel \u2248 miles \xF7 MPG \xD7 diesel price. Driver pay is often per mile on all miles. Fixed costs (insurance, truck and trailer payments) run every day, so idle days cost money. Compare loads by estimated profit and profit per day, not only RPM.",uk:"\u041F\u0440\u0438\u0431\u0443\u0442\u043E\u043A = \u0441\u0442\u0430\u0432\u043A\u0430 \u2212 (\u043F\u0430\u043B\u044C\u043D\u0435 + \u043E\u043F\u043B\u0430\u0442\u0430 \u0432\u043E\u0434\u0456\u044E + \u0441\u0435\u0440\u0432\u0456\u0441 + \u043F\u043B\u0430\u0442\u043D\u0456 \u0434\u043E\u0440\u043E\u0433\u0438 + \u0449\u043E\u0434\u0435\u043D\u043D\u0456 \u0444\u0456\u043A\u0441\u043E\u0432\u0430\u043D\u0456 \u0432\u0438\u0442\u0440\u0430\u0442\u0438). \u041F\u0430\u043B\u044C\u043D\u0435 \u2248 \u043C\u0438\u043B\u0456 \xF7 MPG \xD7 \u0446\u0456\u043D\u0430 \u0434\u0438\u0437\u0435\u043B\u044F. \u0424\u0456\u043A\u0441\u043E\u0432\u0430\u043D\u0456 \u0432\u0438\u0442\u0440\u0430\u0442\u0438 \u0439\u0434\u0443\u0442\u044C \u0449\u043E\u0434\u043D\u044F, \u0442\u043E\u0436 \u043F\u0440\u043E\u0441\u0442\u0456\u0439 \u043A\u043E\u0448\u0442\u0443\u0454 \u0433\u0440\u043E\u0448\u0435\u0439. \u041F\u043E\u0440\u0456\u0432\u043D\u044E\u0439\u0442\u0435 \u0432\u0430\u043D\u0442\u0430\u0436\u0456 \u0437\u0430 \u043F\u0440\u0438\u0431\u0443\u0442\u043A\u043E\u043C \u0456 \u043F\u0440\u0438\u0431\u0443\u0442\u043A\u043E\u043C \u043D\u0430 \u0434\u0435\u043D\u044C.",es:"Beneficio = tarifa \u2212 (combustible + pago al chofer + mantenimiento + peajes + costos fijos diarios). Combustible \u2248 millas \xF7 MPG \xD7 precio del di\xE9sel. Los costos fijos corren cada d\xEDa, as\xED que los d\xEDas parados cuestan. Compara por beneficio estimado y por d\xEDa.",ru:"\u041F\u0440\u0438\u0431\u044B\u043B\u044C = \u0441\u0442\u0430\u0432\u043A\u0430 \u2212 (\u0442\u043E\u043F\u043B\u0438\u0432\u043E + \u043E\u043F\u043B\u0430\u0442\u0430 \u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044E + \u0422\u041E + \u043F\u043B\u0430\u0442\u043D\u044B\u0435 \u0434\u043E\u0440\u043E\u0433\u0438 + \u0435\u0436\u0435\u0434\u043D\u0435\u0432\u043D\u044B\u0435 \u0444\u0438\u043A\u0441. \u0440\u0430\u0441\u0445\u043E\u0434\u044B). \u0422\u043E\u043F\u043B\u0438\u0432\u043E \u2248 \u043C\u0438\u043B\u0438 \xF7 MPG \xD7 \u0446\u0435\u043D\u0430 \u0434\u0438\u0437\u0435\u043B\u044F. \u0424\u0438\u043A\u0441\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0435 \u0440\u0430\u0441\u0445\u043E\u0434\u044B \u0438\u0434\u0443\u0442 \u043A\u0430\u0436\u0434\u044B\u0439 \u0434\u0435\u043D\u044C, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043F\u0440\u043E\u0441\u0442\u043E\u0439 \u0441\u0442\u043E\u0438\u0442 \u0434\u0435\u043D\u0435\u0433. \u0421\u0440\u0430\u0432\u043D\u0438\u0432\u0430\u0439\u0442\u0435 \u0433\u0440\u0443\u0437\u044B \u043F\u043E \u043F\u0440\u0438\u0431\u044B\u043B\u0438 \u0438 \u043F\u0440\u0438\u0431\u044B\u043B\u0438 \u0432 \u0434\u0435\u043D\u044C."},practice:{q:"Fuel only: 650 total miles, 6.5 MPG, diesel $3.90/gal. Fuel cost in dollars?",a:390,tol:1},quiz:[{q:"Why can a high-RPM short load lose money?",o:["Short loads are illegal","Fixed daily costs and deadhead are spread over few paid miles","Brokers never pay short loads"],a:1,why:"Fixed costs and empty miles matter more on short runs."}]},{id:"routes",title:{en:"Planning routes",uk:"\u041F\u043B\u0430\u043D\u0443\u0432\u0430\u043D\u043D\u044F \u043C\u0430\u0440\u0448\u0440\u0443\u0442\u0456\u0432",es:"Planificar rutas",ru:"\u041F\u043B\u0430\u043D\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u043C\u0430\u0440\u0448\u0440\u0443\u0442\u043E\u0432"},body:{en:"Plan with legal driving hours, breaks, 10-hour rests, loading time (about 2 hours) and appointment windows in local time zones. Avoid rush hours in big cities. Leave buffer for weather and traffic. Book the next load before the current one delivers so the truck doesn't sit empty.",uk:"\u041F\u043B\u0430\u043D\u0443\u0439\u0442\u0435 \u0437 \u0443\u0440\u0430\u0445\u0443\u0432\u0430\u043D\u043D\u044F\u043C \u0433\u043E\u0434\u0438\u043D \u0432\u043E\u0434\u0456\u043D\u043D\u044F, \u043F\u0435\u0440\u0435\u0440\u0432, 10-\u0433\u043E\u0434\u0438\u043D\u043D\u043E\u0433\u043E \u0432\u0456\u0434\u043F\u043E\u0447\u0438\u043D\u043A\u0443, \u0437\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u043D\u044F (~2 \u0433\u043E\u0434) \u0456 \u0432\u0456\u043A\u043E\u043D \u0443 \u043C\u0456\u0441\u0446\u0435\u0432\u0438\u0445 \u0447\u0430\u0441\u043E\u0432\u0438\u0445 \u043F\u043E\u044F\u0441\u0430\u0445. \u0423\u043D\u0438\u043A\u0430\u0439\u0442\u0435 \u0433\u043E\u0434\u0438\u043D \u043F\u0456\u043A. \u0417\u0430\u043B\u0438\u0448\u0430\u0439\u0442\u0435 \u0437\u0430\u043F\u0430\u0441 \u043D\u0430 \u043F\u043E\u0433\u043E\u0434\u0443 \u0456 \u0442\u0440\u0430\u0444\u0456\u043A. \u0411\u0440\u043E\u043D\u044E\u0439\u0442\u0435 \u043D\u0430\u0441\u0442\u0443\u043F\u043D\u0438\u0439 \u0432\u0430\u043D\u0442\u0430\u0436 \u0434\u043E \u0434\u043E\u0441\u0442\u0430\u0432\u043A\u0438 \u043F\u043E\u0442\u043E\u0447\u043D\u043E\u0433\u043E.",es:"Planifica con horas legales, pausas, descansos de 10 h, tiempo de carga (~2 h) y ventanas en hora local. Evita horas pico. Deja margen para clima y tr\xE1fico. Reserva la siguiente carga antes de entregar la actual.",ru:"\u041F\u043B\u0430\u043D\u0438\u0440\u0443\u0439\u0442\u0435 \u0441 \u0443\u0447\u0451\u0442\u043E\u043C \u0447\u0430\u0441\u043E\u0432 \u0432\u043E\u0436\u0434\u0435\u043D\u0438\u044F, \u043F\u0435\u0440\u0435\u0440\u044B\u0432\u043E\u0432, 10-\u0447\u0430\u0441\u043E\u0432\u043E\u0433\u043E \u043E\u0442\u0434\u044B\u0445\u0430, \u043F\u043E\u0433\u0440\u0443\u0437\u043A\u0438 (~2 \u0447) \u0438 \u043E\u043A\u043E\u043D \u0432 \u043C\u0435\u0441\u0442\u043D\u043E\u043C \u0432\u0440\u0435\u043C\u0435\u043D\u0438. \u0418\u0437\u0431\u0435\u0433\u0430\u0439\u0442\u0435 \u0447\u0430\u0441\u043E\u0432 \u043F\u0438\u043A. \u041E\u0441\u0442\u0430\u0432\u043B\u044F\u0439\u0442\u0435 \u0437\u0430\u043F\u0430\u0441 \u043D\u0430 \u043F\u043E\u0433\u043E\u0434\u0443 \u0438 \u0442\u0440\u0430\u0444\u0438\u043A. \u0411\u0440\u043E\u043D\u0438\u0440\u0443\u0439\u0442\u0435 \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0438\u0439 \u0433\u0440\u0443\u0437 \u0434\u043E \u0434\u043E\u0441\u0442\u0430\u0432\u043A\u0438 \u0442\u0435\u043A\u0443\u0449\u0435\u0433\u043E."},quiz:[{q:"Pickup at 8:00 AM Eastern. Your clock shows Central time. That is\u2026",o:["8:00 AM Central","7:00 AM Central","9:00 AM Central"],a:1,why:"Eastern is one hour ahead of Central."}]},{id:"delays",title:{en:"Resolving delays",uk:"\u0412\u0438\u0440\u0456\u0448\u0435\u043D\u043D\u044F \u0437\u0430\u0442\u0440\u0438\u043C\u043E\u043A",es:"Resolver retrasos",ru:"\u0420\u0435\u0448\u0435\u043D\u0438\u0435 \u0437\u0430\u0434\u0435\u0440\u0436\u0435\u043A"},body:{en:"When something goes wrong: make sure the driver is safe, get facts (location, cause, estimate), inform the broker with a new ETA, and ask to move the appointment if needed. Document everything with timestamps. Choose the option that is safe, legal and cheapest overall, not just fastest.",uk:"\u041A\u043E\u043B\u0438 \u0449\u043E\u0441\u044C \u043F\u0456\u0448\u043B\u043E \u043D\u0435 \u0442\u0430\u043A: \u043F\u0435\u0440\u0435\u043A\u043E\u043D\u0430\u0439\u0442\u0435\u0441\u044F, \u0449\u043E \u0432\u043E\u0434\u0456\u0439 \u0443 \u0431\u0435\u0437\u043F\u0435\u0446\u0456, \u0437'\u044F\u0441\u0443\u0439\u0442\u0435 \u0444\u0430\u043A\u0442\u0438, \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u0442\u0435 \u0431\u0440\u043E\u043A\u0435\u0440\u0443 \u043D\u043E\u0432\u0438\u0439 ETA \u0456 \u043F\u043E\u043F\u0440\u043E\u0441\u0456\u0442\u044C \u043F\u0435\u0440\u0435\u043D\u0435\u0441\u0442\u0438 \u0437\u0430\u043F\u0438\u0441. \u0424\u0456\u043A\u0441\u0443\u0439\u0442\u0435 \u0432\u0441\u0435 \u0437 \u0447\u0430\u0441\u043E\u043C. \u041E\u0431\u0438\u0440\u0430\u0439\u0442\u0435 \u0431\u0435\u0437\u043F\u0435\u0447\u043D\u0435, \u0437\u0430\u043A\u043E\u043D\u043D\u0435 \u0456 \u0437\u0430\u0433\u0430\u043B\u043E\u043C \u043D\u0430\u0439\u0434\u0435\u0448\u0435\u0432\u0448\u0435 \u0440\u0456\u0448\u0435\u043D\u043D\u044F.",es:"Cuando algo falla: aseg\xFArate de que el chofer est\xE9 a salvo, re\xFAne datos, informa al br\xF3ker con nueva hora estimada y pide mover la cita si hace falta. Documenta con horas. Elige lo seguro, legal y m\xE1s barato en total.",ru:"\u041A\u043E\u0433\u0434\u0430 \u0447\u0442\u043E-\u0442\u043E \u043F\u043E\u0448\u043B\u043E \u043D\u0435 \u0442\u0430\u043A: \u0443\u0431\u0435\u0434\u0438\u0442\u0435\u0441\u044C, \u0447\u0442\u043E \u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C \u0432 \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u043E\u0441\u0442\u0438, \u0432\u044B\u044F\u0441\u043D\u0438\u0442\u0435 \u0444\u0430\u043A\u0442\u044B, \u0441\u043E\u043E\u0431\u0449\u0438\u0442\u0435 \u0431\u0440\u043E\u043A\u0435\u0440\u0443 \u043D\u043E\u0432\u044B\u0439 ETA \u0438 \u043F\u043E\u043F\u0440\u043E\u0441\u0438\u0442\u0435 \u043F\u0435\u0440\u0435\u043D\u0435\u0441\u0442\u0438 \u0437\u0430\u043F\u0438\u0441\u044C. \u0424\u0438\u043A\u0441\u0438\u0440\u0443\u0439\u0442\u0435 \u0432\u0441\u0451 \u0441\u043E \u0432\u0440\u0435\u043C\u0435\u043D\u0435\u043C. \u0412\u044B\u0431\u0438\u0440\u0430\u0439\u0442\u0435 \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u043E\u0435, \u0437\u0430\u043A\u043E\u043D\u043D\u043E\u0435 \u0438 \u0432 \u0446\u0435\u043B\u043E\u043C \u0441\u0430\u043C\u043E\u0435 \u0434\u0435\u0448\u0451\u0432\u043E\u0435 \u0440\u0435\u0448\u0435\u043D\u0438\u0435."},quiz:[{q:"First priority after a breakdown?",o:["Driver safety","Calling the manager","Finding a new load"],a:0,why:"People first, then equipment and freight."}]},{id:"detention",title:{en:"Requesting detention",uk:"\u042F\u043A \u0437\u0430\u043F\u0440\u043E\u0441\u0438\u0442\u0438 detention",es:"Solicitar detenci\xF3n",ru:"\u041A\u0430\u043A \u0437\u0430\u043F\u0440\u043E\u0441\u0438\u0442\u044C detention"},body:{en:"Most brokers pay detention after 2 free hours, often $40\u201375/hour, only with proof: arrival and departure timestamps and notice during the delay. Tell the broker when free time is running out, not after you leave. Then submit a detention request with the times.",uk:"\u0411\u0456\u043B\u044C\u0448\u0456\u0441\u0442\u044C \u0431\u0440\u043E\u043A\u0435\u0440\u0456\u0432 \u043F\u043B\u0430\u0442\u044F\u0442\u044C detention \u043F\u0456\u0441\u043B\u044F 2 \u0431\u0435\u0437\u043A\u043E\u0448\u0442\u043E\u0432\u043D\u0438\u0445 \u0433\u043E\u0434\u0438\u043D ($40\u201375/\u0433\u043E\u0434), \u043B\u0438\u0448\u0435 \u0437 \u0434\u043E\u043A\u0430\u0437\u0430\u043C\u0438: \u0447\u0430\u0441 \u043F\u0440\u0438\u0431\u0443\u0442\u0442\u044F \u0456 \u0432\u0438\u0457\u0437\u0434\u0443 \u0442\u0430 \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u0435\u043D\u043D\u044F \u043F\u0456\u0434 \u0447\u0430\u0441 \u0437\u0430\u0442\u0440\u0438\u043C\u043A\u0438. \u041F\u043E\u043F\u0435\u0440\u0435\u0434\u0436\u0430\u0439\u0442\u0435 \u0431\u0440\u043E\u043A\u0435\u0440\u0430 \u0434\u043E \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F \u0431\u0435\u0437\u043A\u043E\u0448\u0442\u043E\u0432\u043D\u043E\u0433\u043E \u0447\u0430\u0441\u0443, \u0430 \u043D\u0435 \u043F\u0456\u0441\u043B\u044F \u0432\u0438\u0457\u0437\u0434\u0443.",es:"La mayor\xEDa paga detenci\xF3n tras 2 horas libres ($40\u201375/h), solo con pruebas: horas de llegada y salida y aviso durante la espera. Avisa antes de que se acabe el tiempo libre, no despu\xE9s.",ru:"\u0411\u043E\u043B\u044C\u0448\u0438\u043D\u0441\u0442\u0432\u043E \u0431\u0440\u043E\u043A\u0435\u0440\u043E\u0432 \u043F\u043B\u0430\u0442\u044F\u0442 detention \u043F\u043E\u0441\u043B\u0435 2 \u0431\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u044B\u0445 \u0447\u0430\u0441\u043E\u0432 ($40\u201375/\u0447), \u0442\u043E\u043B\u044C\u043A\u043E \u0441 \u0434\u043E\u043A\u0430\u0437\u0430\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0430\u043C\u0438: \u0432\u0440\u0435\u043C\u044F \u043F\u0440\u0438\u0431\u044B\u0442\u0438\u044F \u0438 \u0432\u044B\u0435\u0437\u0434\u0430 \u0438 \u0443\u0432\u0435\u0434\u043E\u043C\u043B\u0435\u043D\u0438\u0435 \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0437\u0430\u0434\u0435\u0440\u0436\u043A\u0438. \u041F\u0440\u0435\u0434\u0443\u043F\u0440\u0435\u0436\u0434\u0430\u0439\u0442\u0435 \u0431\u0440\u043E\u043A\u0435\u0440\u0430 \u0434\u043E \u043E\u043A\u043E\u043D\u0447\u0430\u043D\u0438\u044F \u0431\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u043E\u0433\u043E \u0432\u0440\u0435\u043C\u0435\u043D\u0438."},quiz:[{q:"Detention is most likely paid when\u2026",o:["You email after delivery","You notified the broker during the wait and have timestamps","The driver complains"],a:1,why:"Real-time notice plus timestamps."}]},{id:"tonu",title:{en:"Requesting TONU",uk:"\u042F\u043A \u0437\u0430\u043F\u0440\u043E\u0441\u0438\u0442\u0438 TONU",es:"Solicitar TONU",ru:"\u041A\u0430\u043A \u0437\u0430\u043F\u0440\u043E\u0441\u0438\u0442\u044C TONU"},body:{en:"If a load is cancelled after your truck was dispatched or arrived, ask for TONU (often $150\u2013250). Send proof: rate con, dispatch time, GPS location. Ask immediately and politely; then rebook the truck fast.",uk:"\u042F\u043A\u0449\u043E \u0432\u0430\u043D\u0442\u0430\u0436 \u0441\u043A\u0430\u0441\u0443\u0432\u0430\u043B\u0438 \u043F\u0456\u0441\u043B\u044F \u0432\u0438\u0457\u0437\u0434\u0443 \u0430\u0431\u043E \u043F\u0440\u0438\u0431\u0443\u0442\u0442\u044F \u0442\u0440\u0430\u043A\u0430, \u043F\u0440\u043E\u0441\u0456\u0442\u044C TONU ($150\u2013250). \u041D\u0430\u0434\u0456\u0448\u043B\u0456\u0442\u044C \u0434\u043E\u043A\u0430\u0437\u0438: rate con, \u0447\u0430\u0441 \u0432\u0456\u0434\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u043D\u044F, GPS. \u041F\u0440\u043E\u0441\u0456\u0442\u044C \u043E\u0434\u0440\u0430\u0437\u0443 \u0439 \u0432\u0432\u0456\u0447\u043B\u0438\u0432\u043E, \u043F\u043E\u0442\u0456\u043C \u0448\u0432\u0438\u0434\u043A\u043E \u0448\u0443\u043A\u0430\u0439\u0442\u0435 \u043D\u043E\u0432\u0438\u0439 \u0432\u0430\u043D\u0442\u0430\u0436.",es:"Si cancelan la carga tras despachar o llegar el cami\xF3n, pide TONU ($150\u2013250). Env\xEDa pruebas: confirmaci\xF3n, hora de despacho, GPS. Pide enseguida y con cortes\xEDa; luego vuelve a reservar r\xE1pido.",ru:"\u0415\u0441\u043B\u0438 \u0433\u0440\u0443\u0437 \u043E\u0442\u043C\u0435\u043D\u0438\u043B\u0438 \u043F\u043E\u0441\u043B\u0435 \u0432\u044B\u0435\u0437\u0434\u0430 \u0438\u043B\u0438 \u043F\u0440\u0438\u0431\u044B\u0442\u0438\u044F \u0442\u0440\u0430\u043A\u0430, \u043F\u0440\u043E\u0441\u0438\u0442\u0435 TONU ($150\u2013250). \u041E\u0442\u043F\u0440\u0430\u0432\u044C\u0442\u0435 \u0434\u043E\u043A\u0430\u0437\u0430\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0430: rate con, \u0432\u0440\u0435\u043C\u044F \u043E\u0442\u043F\u0440\u0430\u0432\u043A\u0438, GPS. \u041F\u0440\u043E\u0441\u0438\u0442\u0435 \u0441\u0440\u0430\u0437\u0443 \u0438 \u0432\u0435\u0436\u043B\u0438\u0432\u043E, \u043F\u043E\u0442\u043E\u043C \u0431\u044B\u0441\u0442\u0440\u043E \u0438\u0449\u0438\u0442\u0435 \u043D\u043E\u0432\u044B\u0439 \u0433\u0440\u0443\u0437."},quiz:[{q:"You cancel a load yourself. Can you claim TONU?",o:["Yes","No"],a:1,why:"TONU compensates the carrier when the broker/shipper cancels."}]},{id:"documents",title:{en:"Reading trucking documents",uk:"\u042F\u043A \u0447\u0438\u0442\u0430\u0442\u0438 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0438",es:"Leer documentos",ru:"\u041A\u0430\u043A \u0447\u0438\u0442\u0430\u0442\u044C \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u044B"},body:{en:"On a rate confirmation check: rate, load and reference numbers, pickup/delivery addresses and times, commodity, weight, equipment, accessorial terms and signature. On a BOL check pieces, weight, seal and signatures. On a POD make sure the receiver signed and any exceptions are written. Errors cause short payments and disputes.",uk:"\u0423 rate con \u043F\u0435\u0440\u0435\u0432\u0456\u0440\u044F\u0439\u0442\u0435: \u0441\u0442\u0430\u0432\u043A\u0443, \u043D\u043E\u043C\u0435\u0440\u0438, \u0430\u0434\u0440\u0435\u0441\u0438 \u0439 \u0447\u0430\u0441, \u0432\u0430\u043D\u0442\u0430\u0436, \u0432\u0430\u0433\u0443, \u043E\u0431\u043B\u0430\u0434\u043D\u0430\u043D\u043D\u044F, \u0434\u043E\u043F\u043B\u0430\u0442\u0438 \u0439 \u043F\u0456\u0434\u043F\u0438\u0441. \u0423 BOL \u2014 \u043A\u0456\u043B\u044C\u043A\u0456\u0441\u0442\u044C, \u0432\u0430\u0433\u0443, \u043F\u043B\u043E\u043C\u0431\u0443, \u043F\u0456\u0434\u043F\u0438\u0441\u0438. \u0423 POD \u2014 \u043F\u0456\u0434\u043F\u0438\u0441 \u043E\u0442\u0440\u0438\u043C\u0443\u0432\u0430\u0447\u0430 \u0456 \u043F\u0440\u0438\u043C\u0456\u0442\u043A\u0438. \u041F\u043E\u043C\u0438\u043B\u043A\u0438 \u043F\u0440\u0438\u0437\u0432\u043E\u0434\u044F\u0442\u044C \u0434\u043E \u043D\u0435\u0434\u043E\u043F\u043B\u0430\u0442 \u0456 \u0441\u0443\u043F\u0435\u0440\u0435\u0447\u043E\u043A.",es:"En la confirmaci\xF3n revisa: tarifa, n\xFAmeros, direcciones y horarios, mercanc\xEDa, peso, equipo, cargos extra y firma. En el BOL: piezas, peso, sello y firmas. En el POD: firma del receptor y excepciones. Los errores causan pagos menores.",ru:"\u0412 rate con \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0439\u0442\u0435: \u0441\u0442\u0430\u0432\u043A\u0443, \u043D\u043E\u043C\u0435\u0440\u0430, \u0430\u0434\u0440\u0435\u0441\u0430 \u0438 \u0432\u0440\u0435\u043C\u044F, \u0433\u0440\u0443\u0437, \u0432\u0435\u0441, \u043E\u0431\u043E\u0440\u0443\u0434\u043E\u0432\u0430\u043D\u0438\u0435, \u0434\u043E\u043F\u043B\u0430\u0442\u044B \u0438 \u043F\u043E\u0434\u043F\u0438\u0441\u044C. \u0412 BOL \u2014 \u043A\u043E\u043B\u0438\u0447\u0435\u0441\u0442\u0432\u043E, \u0432\u0435\u0441, \u043F\u043B\u043E\u043C\u0431\u0443, \u043F\u043E\u0434\u043F\u0438\u0441\u0438. \u0412 POD \u2014 \u043F\u043E\u0434\u043F\u0438\u0441\u044C \u043F\u043E\u043B\u0443\u0447\u0430\u0442\u0435\u043B\u044F \u0438 \u043F\u0440\u0438\u043C\u0435\u0447\u0430\u043D\u0438\u044F. \u041E\u0448\u0438\u0431\u043A\u0438 \u0432\u0435\u0434\u0443\u0442 \u043A \u043D\u0435\u0434\u043E\u043F\u043B\u0430\u0442\u0430\u043C \u0438 \u0441\u043F\u043E\u0440\u0430\u043C."},quiz:[{q:"The rate con shows $150 less than you agreed. You\u2026",o:["Sign it anyway","Ask the broker to correct it before signing","Fix it on the invoice later"],a:1,why:"The signed rate con is what gets paid."}]},{id:"fraud",title:{en:"Identifying suspicious loads",uk:"\u041F\u0456\u0434\u043E\u0437\u0440\u0456\u043B\u0456 \u0432\u0430\u043D\u0442\u0430\u0436\u0456",es:"Detectar cargas sospechosas",ru:"\u041F\u043E\u0434\u043E\u0437\u0440\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0435 \u0433\u0440\u0443\u0437\u044B"},body:{en:"Red flags: rates far above market, new or unverifiable MC numbers, free email domains, changes of pickup address by phone, pressure to skip paperwork, requests to pay fees up front. Verify broker authority and contacts, and never move freight without a rate confirmation.",uk:"\u0422\u0440\u0438\u0432\u043E\u0436\u043D\u0456 \u043E\u0437\u043D\u0430\u043A\u0438: \u0441\u0442\u0430\u0432\u043A\u0430 \u043D\u0430\u0431\u0430\u0433\u0430\u0442\u043E \u0432\u0438\u0449\u0430 \u0437\u0430 \u0440\u0438\u043D\u043E\u043A, \u043D\u043E\u0432\u0438\u0439 \u0447\u0438 \u043D\u0435\u043F\u0435\u0440\u0435\u0432\u0456\u0440\u0435\u043D\u0438\u0439 MC, \u0431\u0435\u0437\u043A\u043E\u0448\u0442\u043E\u0432\u043D\u0456 \u043F\u043E\u0448\u0442\u043E\u0432\u0456 \u0434\u043E\u043C\u0435\u043D\u0438, \u0437\u043C\u0456\u043D\u0430 \u0430\u0434\u0440\u0435\u0441\u0438 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u043E\u043C, \u0442\u0438\u0441\u043A \u0431\u0435\u0437 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0456\u0432, \u043F\u0435\u0440\u0435\u0434\u043E\u043F\u043B\u0430\u0442\u0438. \u041F\u0435\u0440\u0435\u0432\u0456\u0440\u044F\u0439\u0442\u0435 \u0431\u0440\u043E\u043A\u0435\u0440\u0430 \u0456 \u043D\u0456\u043A\u043E\u043B\u0438 \u043D\u0435 \u0432\u0435\u0437\u0456\u0442\u044C \u0431\u0435\u0437 rate con.",es:"Se\xF1ales de alerta: tarifas muy por encima del mercado, MC nuevo o no verificable, correos gratuitos, cambios de direcci\xF3n por tel\xE9fono, presi\xF3n para saltarse papeles, pagos por adelantado. Verifica al br\xF3ker y nunca muevas carga sin confirmaci\xF3n.",ru:"\u0422\u0440\u0435\u0432\u043E\u0436\u043D\u044B\u0435 \u043F\u0440\u0438\u0437\u043D\u0430\u043A\u0438: \u0441\u0442\u0430\u0432\u043A\u0430 \u0441\u0438\u043B\u044C\u043D\u043E \u0432\u044B\u0448\u0435 \u0440\u044B\u043D\u043A\u0430, \u043D\u043E\u0432\u044B\u0439 \u0438\u043B\u0438 \u043D\u0435\u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0435\u043C\u044B\u0439 MC, \u0431\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u044B\u0435 \u043F\u043E\u0447\u0442\u043E\u0432\u044B\u0435 \u0434\u043E\u043C\u0435\u043D\u044B, \u0441\u043C\u0435\u043D\u0430 \u0430\u0434\u0440\u0435\u0441\u0430 \u043F\u043E \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0443, \u0434\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u0431\u0435\u0437 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u043E\u0432, \u043F\u0440\u0435\u0434\u043E\u043F\u043B\u0430\u0442\u044B. \u041F\u0440\u043E\u0432\u0435\u0440\u044F\u0439\u0442\u0435 \u0431\u0440\u043E\u043A\u0435\u0440\u0430 \u0438 \u043D\u0435 \u0432\u0435\u0437\u0438\u0442\u0435 \u0431\u0435\u0437 rate con."},quiz:[{q:"A broker offers 40% above market and asks your driver to go to a different address with no rate con. You\u2026",o:["Go, it pays well","Decline and verify the broker","Ask for cash"],a:1,why:"Classic cargo-theft and double-brokering pattern."}]},{id:"fleet",title:{en:"Managing multiple trucks",uk:"\u041A\u0435\u0440\u0443\u0432\u0430\u043D\u043D\u044F \u043A\u0456\u043B\u044C\u043A\u043E\u043C\u0430 \u0442\u0440\u0430\u043A\u0430\u043C\u0438",es:"Gestionar varios camiones",ru:"\u0423\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u0438\u043C\u0438 \u0442\u0440\u0430\u043A\u0430\u043C\u0438"},body:{en:"Keep a schedule for each truck: where and when it will be empty, HOS left, home time due. Plan the next load before the current one delivers. Balance good loads fairly between drivers. Handle urgent problems first, but don't ignore routine messages. Watch deadhead and idle days across the fleet.",uk:"\u0412\u0435\u0434\u0456\u0442\u044C \u0433\u0440\u0430\u0444\u0456\u043A \u043A\u043E\u0436\u043D\u043E\u0433\u043E \u0442\u0440\u0430\u043A\u0430: \u0434\u0435 \u0456 \u043A\u043E\u043B\u0438 \u0431\u0443\u0434\u0435 \u043F\u043E\u0440\u043E\u0436\u043D\u0456\u043C, \u0437\u0430\u043B\u0438\u0448\u043E\u043A HOS, \u043A\u043E\u043B\u0438 \u0434\u043E\u0434\u043E\u043C\u0443. \u041F\u043B\u0430\u043D\u0443\u0439\u0442\u0435 \u043D\u0430\u0441\u0442\u0443\u043F\u043D\u0438\u0439 \u0432\u0430\u043D\u0442\u0430\u0436 \u0437\u0430\u0437\u0434\u0430\u043B\u0435\u0433\u0456\u0434\u044C. \u0420\u043E\u0437\u043F\u043E\u0434\u0456\u043B\u044F\u0439\u0442\u0435 \u0445\u043E\u0440\u043E\u0448\u0456 \u0432\u0430\u043D\u0442\u0430\u0436\u0456 \u0447\u0435\u0441\u043D\u043E. \u0421\u043F\u0435\u0440\u0448\u0443 \u0442\u0435\u0440\u043C\u0456\u043D\u043E\u0432\u0456 \u043F\u0440\u043E\u0431\u043B\u0435\u043C\u0438, \u0430\u043B\u0435 \u043D\u0435 \u0456\u0433\u043D\u043E\u0440\u0443\u0439\u0442\u0435 \u0437\u0432\u0438\u0447\u0430\u0439\u043D\u0456 \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u0435\u043D\u043D\u044F.",es:"Lleva un plan por cami\xF3n: d\xF3nde y cu\xE1ndo queda vac\xEDo, HOS restante, tiempo en casa. Planifica la siguiente carga antes de entregar. Reparte las buenas cargas con justicia. Atiende primero lo urgente sin ignorar lo rutinario.",ru:"\u0412\u0435\u0434\u0438\u0442\u0435 \u0433\u0440\u0430\u0444\u0438\u043A \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u0442\u0440\u0430\u043A\u0430: \u0433\u0434\u0435 \u0438 \u043A\u043E\u0433\u0434\u0430 \u043E\u0441\u0432\u
